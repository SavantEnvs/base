# Publish ghcr.io/savantenvs/base — build ./Dockerfile and push a NEW dated base tag.
#
# We mint a new fixed base deliberately (not per push): the tag is the UTC mint date
# (YYYYMMDD) and integrations pin it in their mayhem/Dockerfile FROM line, so they share
# base layers. :latest tracks the newest mint.
#
# The package must be PUBLICLY pullable: every fork's mayhem/Dockerfile is
# `FROM ghcr.io/savantenvs/base:<tag>` and builds in that fork's Actions with its own
# GITHUB_TOKEN (no cross-repo package access). Package visibility is a one-time UI
# setting on the package (GitHub has no API for it).
name: Publish base image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to publish (default: today UTC, YYYYMMDD)'
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/savantenvs/base
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ./Dockerfile
        run: |
          TAG="${{ inputs.tag }}"; TAG="${TAG:-$(date -u +%Y%m%d)}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Push
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" || true
