# Test the base image: lint, then build ./Dockerfile natively per platform and run test/smoke.sh
# inside it. Nothing is pushed. Runs on every PR and after every push to main.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: shellcheck
        run: shellcheck -S warning ccache-prefill.sh build-and-push.sh test/smoke.sh

      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < Dockerfile

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ./Dockerfile (${{ matrix.platform }})
        run: DOCKER_BUILDKIT=1 docker build --platform "${{ matrix.platform }}" -t base-test .

      - name: Smoke test
        run: docker run --rm -i base-test bash -s < test/smoke.sh
